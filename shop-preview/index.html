<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drakmor 5.0 — Mantu veikals</title><style>
*{box-sizing:border-box}body{margin:0;background:#070609;color:#ffe4a2;font-family:Georgia,serif}.notice{max-width:1647px;margin:8px auto;padding:8px 14px;border:1px solid #a77526;background:#281409;font-size:14px}.scene{position:relative;width:min(100%,1647px);aspect-ratio:1647/928;margin:auto;background:#0b0808 url('../2323.png') center/100% 100% no-repeat;box-shadow:0 0 30px #000}.hot{position:absolute;display:block;border:0;background:transparent;color:transparent;cursor:pointer;padding:0}.hot:focus-visible{outline:3px solid #fff2a4;outline-offset:-3px}.weapon{border-radius:8px}.weapon:hover{box-shadow:inset 0 0 0 3px #ffcc5c,0 0 13px #ff6b0b}.weapon.active{box-shadow:inset 0 0 0 3px #ffe382,0 0 16px 5px #f86706}.category.active{box-shadow:inset 0 0 0 2px #ffc04d,0 0 10px #ff6b09}.nav:hover{box-shadow:inset 0 0 0 3px #ffcb65}.search{position:absolute;left:20.7%;top:22.9%;width:11.4%;height:3.4%;background:#090b10;border:0;color:#ffe9bd;font:clamp(9px,1.1vw,17px) Georgia,serif;padding-left:8px;outline:0}.filter{position:absolute;top:22.8%;height:3.7%;background:#100a08;border:0;color:#fff0ce;font:clamp(8px,.95vw,16px) Georgia,serif;cursor:pointer}.detail-cover{position:absolute;left:67.7%;top:29.7%;width:29.9%;height:48%;background:radial-gradient(ellipse at center,#351209,#160a08 65%,#0c0706);border:2px solid #a65e1a;box-shadow:inset 0 0 0 2px #2c1208,inset 0 0 18px #000;display:none}.detail-cover.show{display:block}.detail-cover .inner{height:100%;padding:3%;overflow:auto;text-align:center}.detail-cover h2{font-size:clamp(13px,1.65vw,26px);margin:0 0 2%;color:#ffdc70}.detail-cover .art{font-size:clamp(22px,5vw,88px);filter:drop-shadow(0 0 15px #ff7300)}.detail-cover p{font-size:clamp(10px,1.05vw,17px);margin:1.4%}.buy{font-size:clamp(12px,1.5vw,23px);background:linear-gradient(#3cce2a,#075a09);color:#fff2c4;border:2px solid #e5b34e;border-radius:8px;padding:1% 7%;cursor:pointer}.status{position:absolute;left:35%;top:3%;width:30%;padding:9px;background:#220b08f2;border:1px solid #f6b746;text-align:center;z-index:5;display:none}.status.show{display:block}.gold{position:absolute;left:86%;top:14%;width:8%;font-weight:bold;color:#ffdf50;font-size:clamp(10px,2vw,28px);text-align:center;text-shadow:2px 2px #000}.panel{position:absolute;inset:20% 17% 15%;background:#120807f7;border:3px solid #e5a13a;padding:3%;z-index:8;display:none;overflow:auto}.panel.show{display:block}.panel button{background:#3b180d;color:#ffdf94;border:2px solid #b47a29;padding:10px;cursor:pointer}.panel h2{margin:0 0 20px}.panel .close{float:right}.empty{color:#caa978}.off{opacity:.22;pointer-events:none}.pager{position:absolute;left:26%;top:75%;width:31%;height:5%;display:flex;justify-content:space-between;align-items:center}.pager button{background:#24110c;color:#ffdb80;border:1px solid #d6983c;padding:4px 10px;cursor:pointer}.pager span{background:#1b0c09;padding:5px}.note{font-size:13px;color:#bfa37c;text-align:center;margin:10px}
@media(max-width:850px){.scene{width:1100px;max-width:none}.viewport{overflow:auto}.notice{font-size:12px}.search,.filter{font-size:12px}.detail-cover h2{font-size:20px}.detail-cover .art{font-size:55px}.detail-cover p{font-size:14px}.buy{font-size:18px}.gold{font-size:22px}}
</style></head><body><div class="notice"><b>TESTA REŽĪMS</b> — jaunais veikala attēls ar klikšķināmām zonām. Pirkumi šeit ir izmēģinājuma dati, nevis Supabase darījumi. <button id="reset">Atjaunot</button></div><div class="viewport"><div class="scene" id="scene"><div class="gold" id="gold">12 450</div><input class="search" id="search" aria-label="Meklēt mantu" placeholder="Meklēt mantu..."><select class="filter" style="left:34%;width:8.5%" id="level"><option value="99">Līmenis: Visi</option><option value="10">Līdz 10</option><option value="20">Līdz 20</option><option value="40">Līdz 40</option></select><select class="filter" style="left:43.4%;width:8.6%" id="rarity"><option>Retums: Visi</option><option>Parasts</option><option>Rets</option><option>Episks</option><option>Leģendārs</option></select><select class="filter" style="left:53%;width:11.2%" id="sort"><option>Pēc līmeņa</option><option>Lētākās</option><option>Dārgākās</option></select><div id="buttons"></div><div class="detail-cover" id="detail"><div class="inner" id="detailInner"></div></div><div class="pager"><button id="prev">❮❮</button><span id="page">1 / 1</span><button id="next">❯❯</button></div><div class="status" id="status"></div><div class="panel" id="panel"><button class="close" id="close">✕</button><h2 id="panelTitle"></h2><div id="panelBody"></div></div></div></div><div class="note">Attēla teksts un cenas pagaidām ir fona sastāvdaļa. Interaktīvajai versijai tās vēlāk pieslēgsim datubāzei.</div><script>
(()=>{'use strict';const items=[['Tērauda zobens',5,350,'⚔️',15],['Sudraba zobens',10,1200,'🗡️',30],['Elfu asmens',20,4500,'🗡️',60],['Pūķa zobens',40,25000,'🔥',120],['Ēnu zobens',45,32000,'⚔️',145],['Orka cirvis',15,2800,'🪓',40],['Kara āmurs',25,6500,'🔨',70],['Aizsarga šķēps',30,9200,'🔱',85],['Kristāla zobens',35,14500,'🗡️',100],['Leģstālā zobens',30,45000,'🔥',110]];const qs=id=>document.getElementById(id),buttons=qs('buttons'),detail=qs('detail'),inner=qs('detailInner');let chosen=-1,category='Ieroči',cash=12450,owned=[],page=1;const fmt=n=>n.toLocaleString('lv-LV');function msg(s){qs('status').textContent=s;qs('status').classList.add('show');qs('status').onclick=()=>qs('status').classList.remove('show')}function hotspot(x,y,w,h,cls,label,cb){const b=document.createElement('button');b.className='hot '+cls;b.style.left=x+'%';b.style.top=y+'%';b.style.width=w+'%';b.style.height=h+'%';b.title=label;b.setAttribute('aria-label',label);b.onclick=cb;buttons.append(b);return b}function render(){buttons.replaceChildren();const names=['Ieroči','Bruņas','Ķiveres','Vairogi','Cimdi','Zābaki','Gredzeni','Kuloni','Artefakti'];names.forEach((n,i)=>{const b=hotspot(1.4,28.1+i*6.25,14.2,5.5,'category',n,()=>{category=n;chosen=-1;detail.classList.remove('show');render();if(n!=='Ieroči')msg(n+': šīs kategorijas preces pievienosim nākamajos soļos.')});if(category===n)b.classList.add('active')});items.forEach((item,i)=>{const col=i%5,row=Math.floor(i/5),b=hotspot(18.25+col*9.45,29.35+row*22.5,8.9,21.25,'weapon',item[0],()=>choose(i));if(chosen===i)b.classList.add('active');if(category!=='Ieroči'||!item[0].toLowerCase().includes(qs('search').value.toLowerCase())||item[1]>Number(qs('level').value)||qs('rarity').value!=='Retums: Visi'&&((item[1]>=40?'Leģendārs':item[1]>=30?'Episks':item[1]>=15?'Rets':'Parasts')!==qs('rarity').value))b.classList.add('off')});const nav=['Inventārs','Pārdošana','Uzlabojumi','Iedvēšana','Komplektu bonusi','VIP veikals','Rotējošs sortiments'];nav.forEach((n,i)=>hotspot(1.6+i*14.1,84.2,13.5,12.3,'nav',n,()=>openPanel(n)));qs('gold').textContent=fmt(cash);qs('page').textContent=page+' / 1'}function choose(i){chosen=i;const [name,lvl,price,icon,bonus]=items[i];detail.classList.add('show');inner.innerHTML='<h2>'+name+'</h2><div class="art">'+icon+'</div><p>Līmenis: '+lvl+'</p><p>Retums: '+(lvl>=40?'Leģendārs':lvl>=30?'Episks':lvl>=15?'Rets':'Parasts')+'</p><p>⚔️ Spēks: +'+bonus+'</p><p>🪙 Cena: '+fmt(price)+'</p><p><button class="buy" id="buy">🛒 Pirkt</button></p>';qs('buy').onclick=()=>{if(owned.includes(name))return msg('Šī manta jau ir inventārā.');if(cash<price)return msg('Nepietiek zelta!');cash-=price;owned.push(name);render();msg('Nopirkts: '+name)};render()}function openPanel(n){qs('panelTitle').textContent=n;qs('panelBody').innerHTML=n==='Inventārs'?(owned.length?owned.map(x=>'<p>⚔️ '+x+'</p>').join(''):'<p class="empty">Inventārs ir tukšs.</p>'):'<p class="empty">Šī funkcija tiks pieslēgta vēlāk.</p>';qs('panel').classList.add('show')}qs('close').onclick=()=>qs('panel').classList.remove('show');qs('search').oninput=render;qs('level').onchange=render;qs('rarity').onchange=render;qs('sort').onchange=()=>msg('Kārtošana tiks pieslēgta dinamiskajam katalogam.');qs('prev').onclick=()=>msg('Šobrīd pieejama pirmā lapa.');qs('next').onclick=()=>msg('Nākamās lapas pieslēgsim datubāzes katalogam.');qs('reset').onclick=()=>{cash=12450;owned=[];chosen=-1;detail.classList.remove('show');render()};render()})();
</script></body></html>
