</style></head><body><main id="page" aria-label="Drakmor 5.0 reģistrācija"><form id="form" autocomplete="on"><input class="field" id="username" style="top:29.1%" placeholder="Lietotājvārds" aria-label="Lietotājvārds" minlength="3" maxlength="24" required><input class="field" id="email" type="email" style="top:35.5%" placeholder="E-pasts" aria-label="E-pasts" autocomplete="email" required><input class="field" id="password" type="password" style="top:41.9%" placeholder="Parole" aria-label="Parole" autocomplete="new-password" minlength="6" required><input class="field" id="confirm" type="password" style="top:48.3%" placeholder="Apstiprini paroli" aria-label="Apstiprini paroli" minlength="6" required><button class="formbtn" id="submit" type="submit" aria-label="Izveidot kontu">Izveidot kontu</button></form><button class="link" id="toggle" aria-label="Pieslēgties" title="Pieslēgties"></button><button class="hot" data-element="water" style="left:20.5%;top:30.3%;width:14.4%;height:47.4%" aria-label="Izvēlēties Ūdens stihiju"></button><button class="hot" data-element="earth" style="left:35.3%;top:30.3%;width:14.3%;height:47.4%" aria-label="Izvēlēties Zemes stihiju"></button><button class="hot" data-element="fire" style="left:50.1%;top:30.3%;width:14.3%;height:47.4%" aria-label="Izvēlēties Uguns stihiju"></button><button class="hot" data-element="air" style="left:64.9%;top:30.3%;width:14.3%;height:47.4%" aria-label="Izvēlēties Gaisa stihiju"></button><button class="next" id="next" aria-label="Turpināt" title="Turpināt"></button><div class="account" id="account"><h2>Tavs varonis</h2><p id="accountEmail"></p><p id="accountElement"></p><button id="logout" type="button">Izrakstīties</button></div><div id="status" class="status" role="status" aria-live="polite"></div></main><div class="footer">Drakmor 5.0 — 1. posms: reģistrācija un stihiju izvēle. Pārējās sadaļas vēl top.</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),names={water:'Ūdens',earth:'Zeme',fire:'Uguns',air:'Gaiss'};let db=null,element=null,mode='signup',user=null,busy=false;
function msg(t,error=false){const e=$('status');e.textContent=t;e.classList.add('show');e.classList.toggle('error',error)}
function choose(el){if(user)return;element=el;document.querySelectorAll('[data-element]').forEach(b=>{const yes=b.dataset.element===el;b.classList.toggle('selected',yes);b.setAttribute('aria-pressed',String(yes))});msg('Izvēlēta stihija: '+names[el]);}
document.querySelectorAll('[data-element]').forEach(b=>b.onclick=()=>choose(b.dataset.element));
function view(u){user=u;$('page').classList.toggle('hideform',!!u);$('account').style.display=u?'block':'none';if(u){$('accountEmail').textContent=u.user_metadata?.hero_name||u.email;$('accountElement').textContent='Stihija: '+(names[u.user_metadata?.element]||'nav izvēlēta');}}
function toggle(){mode=mode==='signup'?'login':'signup';$('page').classList.toggle('loginmode',mode==='login');$('username').required=mode==='signup';$('confirm').required=mode==='signup';$('toggle').title=mode==='login'?'Atgriezties pie reģistrācijas':'Pieslēgties';$('submit').setAttribute('aria-label',mode==='login'?'Pieslēgties':'Izveidot kontu');msg(mode==='login'?'Pieslēgšanās režīms. Ievadi e-pastu un paroli.':'Reģistrācija. Ievadi datus un izvēlies stihiju.')}
$('toggle').onclick=toggle;
$('form').onsubmit=async e=>{e.preventDefault();if(!db)return msg('Kontu sistēma nav pieejama.',true);if(busy)return;const email=$('email').value.trim(),password=$('password').value,hero_name=$('username').value.trim();if(mode==='signup'){if(!element)return msg('Vispirms izvēlies vienu stihiju!',true);if(password!==$('confirm').value)return msg('Paroles nesakrīt.',true);if(hero_name.length<3)return msg('Lietotājvārdam jābūt vismaz 3 rakstzīmēm.',true)}busy=true;msg('Lūdzu, uzgaidi…');try{if(mode==='signup'){const {data,error}=await db.auth.signUp({email,password,options:{emailRedirectTo:location.protocol==='https:'?location.origin+location.pathname:undefined,data:{hero_name,element}}});if(error)throw error;if(data.session){view(data.user);msg('Konts izveidots!');}else{toggle();msg('Pārbaudi e-pastu un apstiprini kontu. Pēc tam pieslēdzies.')}}else{const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;view(data.user);msg('Veiksmīgi pieslēdzies!')}}catch(e){msg('Kļūda: '+e.message,true)}finally{busy=false}};
$('logout').onclick=async()=>{if(!db)return;const {error}=await db.auth.signOut();if(error)return msg(error.message,true);view(null);msg('Esi izrakstījies.')};$('next').onclick=()=>msg(user?'Reģistrācija pabeigta! Spēles pasaule vēl tiek veidota.':'Izvēlies stihiju un izveido kontu, lai turpinātu.');
try{if(!window.supabase)throw Error('Supabase bibliotēku nevar ielādēt');db=window.supabase.createClient('https://cqazpactkfpljjdcvome.supabase.co','sb_publishable_11Y3Qbe3wmjEVb2ebaeXDg_9xcE-s1s');db.auth.getUser().then(({data,error})=>{if(error&&error.name!=='AuthSessionMissingError')return msg(error.message,true);view(data.user);if(data.user)msg('Laipni lūgts atpakaļ!')});db.auth.onAuthStateChange((_,session)=>view(session?.user||null));}catch(e){msg('Kontu sistēma nav pieejama: '+e.message,true)}
})();
